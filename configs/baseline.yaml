# baseline: yolov8n boxes, no augmentation
model: yolov8n.pt
data: data/processed/detect/data.yaml
noise_aug: false
train:
  epochs: 100
  patience: 30
  imgsz: 960        # native frame width, probes are small
  batch: 16
  seed: 0
  # no augmentation
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  fliplr: 0.0
  flipud: 0.0
  mosaic: 0.0

# pose with order-free keypoint loss
model: yolov8n-pose.pt
data: data/processed/pose/data.yaml
noise_aug: true
symmetric_keypoints: true
train:
  epochs: 100
  patience: 100     # no early stopping, use last.pt (best.pt can be an early epoch)
  imgsz: 960        # native frame width, probes are small
  batch: 16
  seed: 0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.5
  degrees: 0        # rotation inflates boxes of thin objects
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  flipud: 0.5
  mosaic: 1.0
  close_mosaic: 10

# Alternative: oriented boxes derived from the keypoints.
model: yolov8n-obb.pt
data: data/processed/obb/data.yaml
noise_aug: true   # extra Albumentations noise / exposure / blur, see erc_pose/train.py
train:
  epochs: 100
  patience: 30
  imgsz: 960        # probes are 16-160 px long in 960x600 frames; do not downscale
  batch: 16
  seed: 0
  # augmentation (Ultralytics built-ins)
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.5        # lighting changes on the Mars Yard
  degrees: 180      # probes lie at any angle; oriented boxes rotate exactly
  translate: 0.1
  scale: 0.5        # 0.3-2 m working distance
  fliplr: 0.5
  flipud: 0.5
  mosaic: 1.0
  close_mosaic: 10
